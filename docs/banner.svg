    <path d="M65 15V134" stroke="#788c74" stroke-width="1.5"/>
    <path d="M14 32Q34 28 50 34M14 46Q34 42 50 48M14 60Q34 56 50 62M80 33Q99 27 116 32M80 47Q99 41 116 46M80 61Q99 55 116 60" fill="none" stroke="#849479" stroke-width="2"/>
