  <g font-family="Noto Sans SC,Microsoft YaHei,sans-serif" fill="#e5ead7">
    <rect x="954" y="69" width="184" height="70" rx="12" fill="#254a40" stroke="#6d8d6f"/>
    <circle cx="985" cy="95" r="8" fill="none" stroke="#bdcb9d" stroke-width="2"/>
    <path d="M973 119Q985 101 997 119" fill="none" stroke="#bdcb9d" stroke-width="2"/>
    <text x="1012" y="99" font-size="16">人物与经历</text><text x="1012" y="120" fill="#9eb7a2" font-size="11">档案 · 关系 · 生平</text>
    <rect x="954" y="172" width="184" height="70" rx="12" fill="#294c3d" stroke="#8d986c"/>
    <path d="M976 192H994V217H976ZM981 199H989M981 205H989" fill="none" stroke="#d2c18e" stroke-width="1.5"/>
