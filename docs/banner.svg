<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Novel Wiki — 从原作到百科</title>
  <desc id="desc">深绿底色上，一本展开的书通过线条连接人物、资料卡与百科页面，象征有出处的原作整理。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#102e2c"/><stop offset="1" stop-color="#173c36"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8db6a3" stroke-opacity=".075"/></pattern>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5efde"/><stop offset="1" stop-color="#d6dfcb"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <path d="M0 335H1200" stroke="#ad965e" stroke-opacity=".5"/>
  <circle cx="1010" cy="174" r="145" fill="none" stroke="#87ae99" stroke-opacity=".12"/>
  <circle cx="1010" cy="174" r="114" fill="none" stroke="#87ae99" stroke-opacity=".12" stroke-dasharray="4 8"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="56" y="48" width="174" height="26" rx="13" fill="#294b40" stroke="#6b8d71" stroke-opacity=".55"/>
    <text x="72" y="66" fill="#c5d7b7" font-size="11" font-weight="600" letter-spacing="2">A SKILL FOR STORIES</text>
    <text x="52" y="158" fill="#f4efdf" font-size="76" font-weight="700" letter-spacing="-3">Novel Wiki</text>
    <text x="57" y="205" fill="#e4e6d4" font-size="25" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" letter-spacing="2">从原作的每一页，到属于这部作品的百科</text>
    <path d="M58 239H106" stroke="#d3b477" stroke-width="3"/>
    <text x="57" y="277" fill="#a8bfad" font-size="13" letter-spacing="2.5">READ · TRACE · CONNECT · CREATE</text>
  </g>
  <g fill="none" stroke="#9fba9e" stroke-width="1.5">
    <path d="M840 184H876Q890 184 890 169V104H952"/>
    <path d="M841 207H951" stroke-dasharray="4 5"/>
    <path d="M834 230H879Q891 230 891 243V278H952"/>
  </g>
